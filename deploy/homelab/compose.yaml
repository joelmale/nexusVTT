name: nexus-vtt2
services:
  postgres:
    image: ghcr.io/joelmale/nexusvtt/postgres:20260917-3754710
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    # PostgreSQL major versions cannot share a data directory.
    - /mnt/docker-nas-vol1/nexusvtt/postgres18:/var/lib/postgresql/data
    networks:
    - nexus-internal-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-nexus}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
    - /mnt/docker-nas-vol1/nexusvtt/redis:/data
    networks:
    - nexus-internal-net
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --no-auth-warning
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  asset-server:
    image: ghcr.io/joelmale/nexusvtt/asset-service:20260917-3754710
    container_name: nexus-vtt2-asset-server
    hostname: nexus-vtt2-asset-server
    user: 1000:1000
    environment:
      NODE_ENV: production
      PORT: 5003
      ASSETS_PATH: /app/static-assets
      ASSET_SERVICE_SECRET: ${ASSET_SERVICE_SECRET}
      LIBRARY_DATA_PATH: /app/assets-data
      LIBRARY_MANIFEST_PATH: /app/assets-data/manifests/manifest-v2.json
    volumes:
    - /mnt/docker-nas-vol1/nexusvtt/assets:/app/static-assets/assets
    - /mnt/docker-nas-vol1/nexusvtt/user-assets:/app/static-assets/users
    - /mnt/docker-nas-vol1/nexusvtt/library-assets:/app/assets-data
    - /mnt/docker-nas-vol1/nexusvtt/tmt-seed:/seed/tmt:ro
    networks:
    - homelab-net
    - nexus-internal-net
    healthcheck:
      test:
      - CMD-SHELL
      - 'node -e "const port = process.env.PORT || 5003; require(''http'').get(''http://127.0.0.1:''
        + port + ''/health'', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(''error'',
        () => process.exit(1))"'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  nexus-forge:
    image: ghcr.io/joelmale/nexus-forge:master-dc49824
    container_name: nexus-vtt2-forge
    hostname: nexus-vtt2-forge
    networks:
    - homelab-net
    restart: unless-stopped
  frontend:
    image: ghcr.io/joelmale/nexusvtt/frontend:20260917-3754710
    container_name: nexus-vtt2-frontend
    hostname: nexus-vtt2-frontend
    environment:
      NODE_ENV: production
    networks:
    - homelab-net
    restart: unless-stopped
  backend:
    image: ghcr.io/joelmale/nexusvtt/backend:20260917-3754710
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: production
      # Developer tooling switch: registers the /api/dev/* seeding and
      # teardown routes, and (via GET /api/client-config) reveals the
      # matching UI. Defaults to false, so the tooling is absent unless an
      # operator opts in. Set DEV_MODE=true in the stack environment and
      # restart the backend; no image rebuild is needed.
      #
      # NOTE: VITE_DEV_MODE cannot do this. VITE_* values are compiled into
      # the frontend bundle at image build time, which is why setting it on
      # a running container has no effect.
      DEV_MODE: ${DEV_MODE:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_CALLBACK_URL: ${DISCORD_CALLBACK_URL}
      DOC_API_URL: http://doc-api:3000
      ASSET_API_URL: http://asset-server:5003
      ASSET_SERVICE_SECRET: ${ASSET_SERVICE_SECRET}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      MULTIPLAYER_SLO_COMMIT_P95_MS: ${MULTIPLAYER_SLO_COMMIT_P95_MS:-250}
      MULTIPLAYER_SLO_RESYNC_RATE_RATIO: ${MULTIPLAYER_SLO_RESYNC_RATE_RATIO:-0.01}
      MULTIPLAYER_SLO_QUEUE_DEPTH: ${MULTIPLAYER_SLO_QUEUE_DEPTH:-100}
      MULTIPLAYER_SLO_HEAP_UTILIZATION_RATIO: ${MULTIPLAYER_SLO_HEAP_UTILIZATION_RATIO:-0.9}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asset-server:
        condition: service_healthy
    networks:
    - homelab-net
    - nexus-internal-net
    restart: unless-stopped
  codex-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - codex-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
    - nexus-internal-net
    deploy:
      resources:
        limits:
          memory: 1G
    restart: on-failure
  codex-minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${CODEX_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${CODEX_MINIO_ROOT_PASSWORD}
    volumes:
    - codex-minio-data:/data
    networks:
    - nexus-internal-net
    restart: on-failure
  doc-api:
    image: ghcr.io/joelmale/nexuscodex-doc-api:main-4c583c2
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${CODEX_POSTGRES_DB:-doclib}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      ELASTICSEARCH_URL: http://codex-elasticsearch:9200
      S3_ENDPOINT: http://codex-minio:9000
      S3_PUBLIC_ENDPOINT: ${CODEX_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${CODEX_MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${CODEX_MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: documents
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      JWT_SECRET: ${CODEX_JWT_SECRET}
      AUTH_DISABLED: 'true'
      EMBEDDINGS_PROVIDER: hash
    networks:
    - homelab-net
    - nexus-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codex-elasticsearch:
        condition: service_started
      codex-minio:
        condition: service_started
    restart: on-failure
  doc-processor:
    image: ghcr.io/joelmale/nexuscodex-doc-processor:main-4c583c2
    environment:
      NODE_ENV: production
      PORT: null
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${CODEX_POSTGRES_DB:-doclib}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      ELASTICSEARCH_URL: http://codex-elasticsearch:9200
      S3_ENDPOINT: http://codex-minio:9000
      S3_PUBLIC_ENDPOINT: ${CODEX_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${CODEX_MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${CODEX_MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: documents
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      JWT_SECRET: null
      AUTH_DISABLED: null
      EMBEDDINGS_PROVIDER: null
    networks:
    - nexus-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codex-elasticsearch:
        condition: service_started
      codex-minio:
        condition: service_started
    restart: on-failure
  doc-websocket:
    image: ghcr.io/joelmale/nexuscodex-doc-websocket:main-4c583c2
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${CODEX_POSTGRES_DB:-doclib}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      SESSION_TTL: 3600
      JWT_SECRET: ${CODEX_JWT_SECRET}
      ELASTICSEARCH_URL: http://codex-elasticsearch:9200
    networks:
    - homelab-net
    - nexus-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
  admin-ui:
    image: ghcr.io/joelmale/nexuscodex-admin-ui:main-4c583c2
    environment:
      VITE_DOC_API_URL: /api
      VITE_WEBSOCKET_URL: /ws
    networks:
    - homelab-net
    depends_on:
    - doc-api
    restart: on-failure
  dm-ui:
    image: ghcr.io/joelmale/nexuscodex-dm-ui:main-4c583c2
    environment:
      VITE_DOC_API_URL: /api
      VITE_WEBSOCKET_URL: /ws
    networks:
    - homelab-net
    depends_on:
    - doc-api
    restart: on-failure
networks:
  homelab-net:
    external: true
  nexus-internal-net:
    internal: true
volumes:
  codex-elasticsearch-data:
    name: nexus-vtt2-codex-elasticsearch-data
  codex-minio-data:
    name: nexus-vtt2-codex-minio-data
