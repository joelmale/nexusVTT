name: nexus-vtt2
services:
  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/joelmale/nexusvtt/postgres:latest}
    pull_policy: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/homelab/.env.example}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    # PostgreSQL major versions cannot share a data directory.
    - ${NEXUS_STORAGE_ROOT:-/mnt/docker-nas-vol1/nexusvtt}/postgres18:/var/lib/postgresql/data
    networks:
    - nexus-internal-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-nexus}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required, see deploy/homelab/.env.example}
    volumes:
    - ${NEXUS_STORAGE_ROOT:-/mnt/docker-nas-vol1/nexusvtt}/redis:/data
    networks:
    - nexus-internal-net
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --no-auth-warning
      - -a
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required, see deploy/homelab/.env.example}
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  asset-server:
    image: ${ASSET_SERVICE_IMAGE:-ghcr.io/joelmale/nexusvtt/asset-service:latest}
    pull_policy: always
    container_name: nexus-vtt2-asset-server
    hostname: nexus-vtt2-asset-server
    user: 1000:1000
    environment:
      NODE_ENV: production
      PORT: 5003
      ASSETS_PATH: /app/static-assets
      ASSET_SERVICE_SECRET: ${ASSET_SERVICE_SECRET:?ASSET_SERVICE_SECRET is required, see deploy/homelab/.env.example}
      ASSET_ADMIN_SERVICE_SECRET: ${ASSET_ADMIN_SERVICE_SECRET:?ASSET_ADMIN_SERVICE_SECRET is required, see deploy/homelab/.env.example}
      LIBRARY_DATA_PATH: /app/assets-data
      LIBRARY_MANIFEST_PATH: /app/assets-data/manifests/manifest-v2.json
    volumes:
    - ${NEXUS_STORAGE_ROOT:-/mnt/docker-nas-vol1/nexusvtt}/assets:/app/static-assets/assets
    - ${NEXUS_STORAGE_ROOT:-/mnt/docker-nas-vol1/nexusvtt}/user-assets:/app/static-assets/users
    - ${NEXUS_STORAGE_ROOT:-/mnt/docker-nas-vol1/nexusvtt}/library-assets:/app/assets-data
    - ${NEXUS_STORAGE_ROOT:-/mnt/docker-nas-vol1/nexusvtt}/tmt-seed:/seed/tmt:ro
    networks:
    - homelab-net
    - nexus-internal-net
    healthcheck:
      test:
      - CMD-SHELL
      - 'node -e "const port = process.env.PORT || 5003; require(''http'').get(''http://127.0.0.1:''
        + port + ''/health'', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(''error'',
        () => process.exit(1))"'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  nexus-forge:
    image: ${NEXUS_FORGE_IMAGE:-ghcr.io/joelmale/nexus-forge:master}
    pull_policy: always
    container_name: nexus-vtt2-forge
    hostname: nexus-vtt2-forge
    networks:
    - homelab-net
    restart: unless-stopped
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/joelmale/nexusvtt/frontend:latest}
    pull_policy: always
    container_name: nexus-vtt2-frontend
    hostname: nexus-vtt2-frontend
    environment:
      NODE_ENV: production
    # nexus-internal-net lets the gateway proxy its authenticated, read-only
    # /codex-api/ allowlist to doc-api, which is no longer on homelab-net.
    # homelab-net stays so the edge proxy (npm) can reach this container and
    # it can reach backend/asset-server/doc-websocket.
    networks:
    - homelab-net
    - nexus-internal-net
    restart: unless-stopped
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/joelmale/nexusvtt/backend:latest}
    pull_policy: always
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: production
      # Developer tooling switch: registers the /api/dev/* seeding and
      # teardown routes, and (via GET /api/client-config) reveals the
      # matching UI. Defaults to false, so the tooling is absent unless an
      # operator opts in. Set DEV_MODE=true in the stack environment and
      # restart the backend; no image rebuild is needed.
      #
      # NOTE: VITE_DEV_MODE cannot do this. VITE_* values are compiled into
      # the frontend bundle at image build time, which is why setting it on
      # a running container has no effect.
      DEV_MODE: ${DEV_MODE:-false}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required, see deploy/homelab/.env.example}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required, see deploy/homelab/.env.example}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see deploy/homelab/.env.example}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required, see deploy/homelab/.env.example}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required, see deploy/homelab/.env.example}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required, see deploy/homelab/.env.example}
      DISCORD_CALLBACK_URL: ${DISCORD_CALLBACK_URL}
      DOC_API_URL: http://doc-api:3000
      ASSET_API_URL: http://asset-server:5003
      ASSET_SERVICE_SECRET: ${ASSET_SERVICE_SECRET:?ASSET_SERVICE_SECRET is required, see deploy/homelab/.env.example}
      # Phase 0 (private-admin-control-plane.md): server/routes/metrics.routes.ts
      # only checks the bearer token when configuredToken is truthy, so an
      # empty value serves GET /metrics with no auth at all. Require it in
      # production instead of silently failing open.
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?METRICS_AUTH_TOKEN is required, see deploy/homelab/.env.example}
      MULTIPLAYER_SLO_COMMIT_P95_MS: ${MULTIPLAYER_SLO_COMMIT_P95_MS:-250}
      MULTIPLAYER_SLO_RESYNC_RATE_RATIO: ${MULTIPLAYER_SLO_RESYNC_RATE_RATIO:-0.01}
      MULTIPLAYER_SLO_QUEUE_DEPTH: ${MULTIPLAYER_SLO_QUEUE_DEPTH:-100}
      MULTIPLAYER_SLO_HEAP_UTILIZATION_RATIO: ${MULTIPLAYER_SLO_HEAP_UTILIZATION_RATIO:-0.9}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asset-server:
        condition: service_healthy
    networks:
    - homelab-net
    - nexus-internal-net
    restart: unless-stopped
  control-api:
    image: ${CONTROL_API_IMAGE:-ghcr.io/joelmale/nexusvtt/control-api:latest}
    pull_policy: always
    environment:
      NODE_ENV: production
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:?CONTROL_DATABASE_URL is required, see deploy/homelab/.env.example}
      DOC_API_URL: http://doc-api:3000
      ADMIN_ORIGIN: https://admin.internal.nexusvtt.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required, see deploy/homelab/.env.example}
      CONTROL_GOOGLE_CALLBACK_URL: https://admin.internal.nexusvtt.com/control-api/v1/auth/google/callback
      CONTROL_SESSION_SECRET: ${CONTROL_SESSION_SECRET:?CONTROL_SESSION_SECRET is required, see deploy/homelab/.env.example}
      TRUST_PROXY_HOPS: 1
      # Wave 2 (control-api-adr.md): asset admin, operations summary, rules.
      ASSET_SERVICE_URL: http://asset-server:5003
      ASSET_ADMIN_SERVICE_SECRET: ${ASSET_ADMIN_SERVICE_SECRET:?ASSET_ADMIN_SERVICE_SECRET is required, see deploy/homelab/.env.example}
      BACKEND_URL: http://backend:5001
      PROMETHEUS_URL: ${CONTROL_PROMETHEUS_URL:-}
      GRAFANA_URL: ${CONTROL_GRAFANA_URL:-}
      RULES_ADMIN_SERVICE_TOKEN: ${RULES_ADMIN_SERVICE_TOKEN:?RULES_ADMIN_SERVICE_TOKEN is required, see deploy/homelab/.env.example}
    # Private admin control plane (control-api-adr.md): the only browser-facing
    # API on the :8081 admin listener, and the only component that calls
    # doc-api on an administrator's behalf. nexus-internal-net reaches
    # postgres/doc-api and lets the frontend gateway proxy /control-api/ to
    # this service; the dedicated nexus-control-egress-net gives outbound
    # internet for the Google OAuth token exchange only. Nothing else may join
    # nexus-control-egress-net, and this service must never join homelab-net
    # or publish a host port (port 4000 is container-only).
    networks:
    - nexus-internal-net
    - nexus-control-egress-net
    healthcheck:
      test:
      - CMD-SHELL
      - 'node -e "require(''http'').get(''http://127.0.0.1:4000/healthz'', (res) => process.exit(res.statusCode
        === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"'
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      doc-api:
        condition: service_started
    restart: unless-stopped
  codex-elasticsearch:
    image: ${CODEX_ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.5.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - codex-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
    - nexus-internal-net
    deploy:
      resources:
        limits:
          memory: 1G
    restart: on-failure
  codex-minio:
    image: ${CODEX_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    pull_policy: if_not_present
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${CODEX_MINIO_ROOT_USER:?CODEX_MINIO_ROOT_USER is required, see deploy/homelab/.env.example}
      MINIO_ROOT_PASSWORD: ${CODEX_MINIO_ROOT_PASSWORD:?CODEX_MINIO_ROOT_PASSWORD is required, see deploy/homelab/.env.example}
    volumes:
    - codex-minio-data:/data
    networks:
    - nexus-internal-net
    restart: on-failure
  doc-api:
    image: ${DOC_API_IMAGE:-ghcr.io/joelmale/nexuscodex-doc-api:main}
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/homelab/.env.example}@postgres:5432/${CODEX_POSTGRES_DB:-doclib}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required, see deploy/homelab/.env.example}@redis:6379/1
      ELASTICSEARCH_URL: http://codex-elasticsearch:9200
      S3_ENDPOINT: http://codex-minio:9000
      S3_PUBLIC_ENDPOINT: ${CODEX_S3_PUBLIC_ENDPOINT:-http://codex-minio:9000}
      S3_ACCESS_KEY: ${CODEX_MINIO_ROOT_USER:?CODEX_MINIO_ROOT_USER is required, see deploy/homelab/.env.example}
      S3_SECRET_KEY: ${CODEX_MINIO_ROOT_PASSWORD:?CODEX_MINIO_ROOT_PASSWORD is required, see deploy/homelab/.env.example}
      S3_BUCKET: documents
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      JWT_SECRET: ${CODEX_JWT_SECRET:?CODEX_JWT_SECRET is required, see deploy/homelab/.env.example}
      AUTH_DISABLED: 'true'
      EMBEDDINGS_PROVIDER: hash
      # Optional shared secret for the rules admin API; set the same value on
      # control-api (RULES_ADMIN_SERVICE_TOKEN). Required: doc-api refuses rules
      # admin requests in production without it.
      RULES_ADMIN_SERVICE_TOKEN: ${RULES_ADMIN_SERVICE_TOKEN:?RULES_ADMIN_SERVICE_TOKEN is required, see deploy/homelab/.env.example}
      METRICS_AUTH_TOKEN: ${CODEX_METRICS_AUTH_TOKEN:?CODEX_METRICS_AUTH_TOKEN is required, see deploy/homelab/.env.example}
    # Phase 0 containment (private-admin-control-plane.md invariant 2): doc-api
    # runs with AUTH_DISABLED=true, so it must never sit on a network shared
    # with untrusted containers. homelab-net is the flat bridge shared with
    # every other homelab service (media stack, dashboards, the npm edge
    # proxy, etc.) -- any of them could otherwise resolve http://doc-api:3000
    # with zero authentication. nexus-internal-net is docker-internal (no
    # external connectivity) and is enough for postgres/redis/elasticsearch/
    # minio and the frontend gateway (see frontend's networks below) to reach
    # it. Do not add homelab-net back here without re-enabling AUTH_DISABLED.
    # nexus-codex-egress-net gives outbound internet (doc-api downloads its
    # Prisma engine at startup and crash-loops on an internal-only network);
    # nothing else may join it.
    networks:
    - nexus-internal-net
    - nexus-codex-egress-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codex-elasticsearch:
        condition: service_started
      codex-minio:
        condition: service_started
    restart: on-failure
  doc-processor:
    image: ${DOC_PROCESSOR_IMAGE:-ghcr.io/joelmale/nexuscodex-doc-processor:main}
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: null
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/homelab/.env.example}@postgres:5432/${CODEX_POSTGRES_DB:-doclib}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required, see deploy/homelab/.env.example}@redis:6379/1
      ELASTICSEARCH_URL: http://codex-elasticsearch:9200
      S3_ENDPOINT: http://codex-minio:9000
      S3_PUBLIC_ENDPOINT: ${CODEX_S3_PUBLIC_ENDPOINT:-http://codex-minio:9000}
      S3_ACCESS_KEY: ${CODEX_MINIO_ROOT_USER:?CODEX_MINIO_ROOT_USER is required, see deploy/homelab/.env.example}
      S3_SECRET_KEY: ${CODEX_MINIO_ROOT_PASSWORD:?CODEX_MINIO_ROOT_PASSWORD is required, see deploy/homelab/.env.example}
      S3_BUCKET: documents
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      JWT_SECRET: null
      AUTH_DISABLED: null
      EMBEDDINGS_PROVIDER: null
      METRICS_PORT: 9464
      METRICS_AUTH_TOKEN: ${CODEX_METRICS_AUTH_TOKEN:?CODEX_METRICS_AUTH_TOKEN is required, see deploy/homelab/.env.example}
    networks:
    - nexus-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codex-elasticsearch:
        condition: service_started
      codex-minio:
        condition: service_started
    restart: on-failure
  doc-websocket:
    image: ${DOC_WEBSOCKET_IMAGE:-ghcr.io/joelmale/nexuscodex-doc-websocket:main}
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/homelab/.env.example}@postgres:5432/${CODEX_POSTGRES_DB:-doclib}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required, see deploy/homelab/.env.example}@redis:6379/1
      SESSION_TTL: 3600
      JWT_SECRET: ${CODEX_JWT_SECRET:?CODEX_JWT_SECRET is required, see deploy/homelab/.env.example}
      ELASTICSEARCH_URL: http://codex-elasticsearch:9200
    networks:
    - homelab-net
    - nexus-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
  # No standalone admin-ui/dm-ui containers (private-admin-control-plane.md
  # invariant 3): their nginx proxied /api/ to doc-api unauthenticated. The
  # frontend gateway serves /codex-dm/; the admin UI returns on the Phase 1
  # private vhost.
networks:
  homelab-net:
    external: true
  nexus-internal-net:
    internal: true
  nexus-codex-egress-net: {}
  # control-api only (Google OAuth needs outbound internet); never homelab-net.
  nexus-control-egress-net: {}
volumes:
  codex-elasticsearch-data:
    name: nexus-vtt2-codex-elasticsearch-data
  codex-minio-data:
    name: nexus-vtt2-codex-minio-data
