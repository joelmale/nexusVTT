services:
  postgres:
    image: ghcr.io/joelmale/nexusvtt/postgres:20260917-3754710
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # PostgreSQL major versions cannot share a data directory.
      - /mnt/docker-nas-vol1/nexusvtt/postgres18:/var/lib/postgresql/data
    networks:
      - nexus-internal-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-nexus}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - /mnt/docker-nas-vol1/nexusvtt/redis:/data
    networks:
      - nexus-internal-net
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --no-auth-warning
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  codex-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - codex-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - nexus-internal-net
    deploy:
      resources:
        limits:
          memory: 1G
    restart: on-failure

  garage-init-config:
    image: alpine:latest
    container_name: nexus-vtt2-garage-init-config
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/garage /var/lib/garage/data
        cat << 'EOF' > /etc/garage/garage.toml
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        db_engine = "lmdb"
        replication_factor = 1

        rpc_bind_addr = "0.0.0.0:3901"
        rpc_public_addr = "127.0.0.1:3901"
        rpc_secret = "f5a8b792e3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e"

        [s3_api]
        api_bind_addr = "0.0.0.0:9000"
        s3_region = "us-east-1"
        root_domain = ".s3.garage"

        [s3_web]
        bind_addr = "0.0.0.0:3902"
        root_domain = ".web.garage"
        index = "index.html"

        [admin]
        api_bind_addr = "0.0.0.0:3903"
        EOF
    volumes:
      - garage-config:/etc/garage
      - /mnt/docker-nas-vol1/nexusvtt/garage/data:/var/lib/garage/data

  codex-garage:
    image: dxflrs/garage:v2.4.1
    container_name: nexus-vtt2-codex-garage
    hostname: codex-garage
    restart: on-failure
    depends_on:
      garage-init-config:
        condition: service_completed_successfully
    command:
      - /garage
      - -c
      - /etc/garage/garage.toml
      - server
      - --single-node
      - --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${CODEX_MINIO_ROOT_USER:-minioadmin}
      GARAGE_DEFAULT_SECRET_KEY: ${CODEX_MINIO_ROOT_PASSWORD:-minioadmin}
      GARAGE_DEFAULT_BUCKET: documents
    volumes:
      - garage-config:/etc/garage:ro
      - garage-meta:/var/lib/garage/meta
      - /mnt/docker-nas-vol1/nexusvtt/garage/data:/var/lib/garage/data
    networks:
      nexus-internal-net:
        aliases:
          - codex-minio

networks:
  homelab-net:
    external: true
  nexus-internal-net:
    internal: true
  nexus-codex-egress-net: {}
  # control-api only (Google OAuth needs outbound internet); never homelab-net.
  nexus-control-egress-net: {}

volumes:
  codex-elasticsearch-data:
    name: nexus-vtt2-codex-elasticsearch-data
  codex-minio-data:
    name: nexus-vtt2-codex-minio-data
  garage-config:
    name: nexus-vtt2-garage-config
  garage-meta:
    name: nexus-vtt2-garage-meta
