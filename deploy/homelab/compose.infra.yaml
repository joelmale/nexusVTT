services:
  postgres:
    image: ghcr.io/joelmale/nexusvtt/postgres:20260917-3754710
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # PostgreSQL major versions cannot share a data directory.
      - /mnt/docker-nas-vol1/nexusvtt/postgres18:/var/lib/postgresql/data
    networks:
      - nexus-internal-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-nexus}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - /mnt/docker-nas-vol1/nexusvtt/redis:/data
    networks:
      - nexus-internal-net
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --no-auth-warning
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  codex-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - codex-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - nexus-internal-net
    deploy:
      resources:
        limits:
          memory: 1G
    restart: on-failure

  codex-minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${CODEX_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${CODEX_MINIO_ROOT_PASSWORD}
    volumes:
      - codex-minio-data:/data
    networks:
      - nexus-internal-net
    restart: on-failure

networks:
  homelab-net:
    external: true
  nexus-internal-net:
    internal: true

volumes:
  codex-elasticsearch-data:
    name: nexus-vtt2-codex-elasticsearch-data
  codex-minio-data:
    name: nexus-vtt2-codex-minio-data
