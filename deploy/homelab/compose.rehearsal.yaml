name: nexus-migration-phase3-e078895

services:
  postgres:
    environment:
      POSTGRES_DB: ${REHEARSAL_POSTGRES_DB:-nexus_rehearsal}
      POSTGRES_USER: ${REHEARSAL_POSTGRES_USER:-nexus_rehearsal}
      POSTGRES_PASSWORD: ${REHEARSAL_POSTGRES_PASSWORD:-nexus-rehearsal}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${REHEARSAL_POSTGRES_USER:-nexus_rehearsal}']
    volumes: !override
      - rehearsal-vtt-postgres-data:/var/lib/postgresql/data
    networks: !override [rehearsal-net]
  redis:
    command: redis-server --appendonly yes --requirepass ${REHEARSAL_REDIS_PASSWORD:-nexus-rehearsal}
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REHEARSAL_REDIS_PASSWORD:-nexus-rehearsal}', 'ping']
    volumes: !override
      - rehearsal-vtt-redis-data:/data
    networks: !override [rehearsal-net]
  asset-server:
    container_name: nexus-migration-phase3-e078895-asset-server
    hostname: nexus-migration-phase3-e078895-asset-server
    environment:
      ASSET_SERVICE_SECRET: ${REHEARSAL_ASSET_SERVICE_SECRET:-nexus-rehearsal-assets}
    volumes: !override
      - rehearsal-assets:/app/static-assets/assets
      - rehearsal-user-assets:/app/static-assets/users
      - rehearsal-library-assets:/app/assets-data
      - rehearsal-tmt-seed:/seed/tmt:ro
    networks: !override [rehearsal-net]
  nexus-forge:
    container_name: nexus-migration-phase3-e078895-forge
    hostname: nexus-migration-phase3-e078895-forge
    networks: !override [rehearsal-net]
  frontend:
    container_name: nexus-migration-phase3-e078895-frontend
    hostname: nexus-migration-phase3-e078895-frontend
    networks: !override [rehearsal-net]
  backend:
    environment:
      CORS_ORIGIN: ${REHEARSAL_CORS_ORIGIN:-http://nexus-migration-phase3-e078895.invalid}
      DATABASE_URL: postgresql://${REHEARSAL_POSTGRES_USER:-nexus_rehearsal}:${REHEARSAL_POSTGRES_PASSWORD:-nexus-rehearsal}@postgres:5432/${REHEARSAL_POSTGRES_DB:-nexus_rehearsal}
      REDIS_URL: redis://:${REHEARSAL_REDIS_PASSWORD:-nexus-rehearsal}@redis:6379
      JWT_SECRET: ${REHEARSAL_JWT_SECRET:-nexus-migration-phase3-e078895-jwt}
      SESSION_SECRET: ${REHEARSAL_SESSION_SECRET:-nexus-migration-phase3-e078895-session}
      GOOGLE_CLIENT_ID: ${REHEARSAL_GOOGLE_CLIENT_ID:-rehearsal-disabled}
      GOOGLE_CLIENT_SECRET: ${REHEARSAL_GOOGLE_CLIENT_SECRET:-rehearsal-disabled}
      GOOGLE_CALLBACK_URL: ${REHEARSAL_GOOGLE_CALLBACK_URL:-http://nexus-migration-phase3-e078895.invalid/auth/google/callback}
      DISCORD_CLIENT_ID: ${REHEARSAL_DISCORD_CLIENT_ID:-rehearsal-disabled}
      DISCORD_CLIENT_SECRET: ${REHEARSAL_DISCORD_CLIENT_SECRET:-rehearsal-disabled}
      DISCORD_CALLBACK_URL: ${REHEARSAL_DISCORD_CALLBACK_URL:-http://nexus-migration-phase3-e078895.invalid/auth/discord/callback}
      ASSET_SERVICE_SECRET: ${REHEARSAL_ASSET_SERVICE_SECRET:-nexus-rehearsal-assets}
      METRICS_AUTH_TOKEN: ${REHEARSAL_METRICS_AUTH_TOKEN:-nexus-migration-phase3-e078895-metrics}
    networks: !override [rehearsal-net]
  codex-postgres:
    environment:
      POSTGRES_DB: ${REHEARSAL_CODEX_POSTGRES_DB:-doclib_rehearsal}
      POSTGRES_USER: ${REHEARSAL_CODEX_POSTGRES_USER:-nexus_rehearsal}
      POSTGRES_PASSWORD: ${REHEARSAL_CODEX_POSTGRES_PASSWORD:-nexus-rehearsal}
    volumes: !override
      - rehearsal-codex-postgres-data:/var/lib/postgresql/data
    networks: !override [rehearsal-net]
  codex-redis:
    command: redis-server --appendonly yes --requirepass ${REHEARSAL_CODEX_REDIS_PASSWORD:-nexus-rehearsal}
    volumes: !override
      - rehearsal-codex-redis-data:/data
    networks: !override [rehearsal-net]
  codex-elasticsearch:
    volumes: !override
      - rehearsal-codex-elasticsearch-data:/usr/share/elasticsearch/data
    networks: !override [rehearsal-net]
  codex-minio:
    pull_policy: never
    environment:
      MINIO_ROOT_USER: ${REHEARSAL_CODEX_MINIO_ROOT_USER:-nexus-rehearsal}
      MINIO_ROOT_PASSWORD: ${REHEARSAL_CODEX_MINIO_ROOT_PASSWORD:-nexus-rehearsal}
    volumes: !override
      - rehearsal-codex-minio-data:/data
    networks: !override [rehearsal-net]
  doc-api:
    environment:
      DATABASE_URL: postgresql://${REHEARSAL_CODEX_POSTGRES_USER:-nexus-rehearsal}:${REHEARSAL_CODEX_POSTGRES_PASSWORD:-nexus-rehearsal}@codex-postgres:5432/${REHEARSAL_CODEX_POSTGRES_DB:-doclib_rehearsal}
      REDIS_URL: redis://:${REHEARSAL_CODEX_REDIS_PASSWORD:-nexus-rehearsal}@codex-redis:6379
      S3_ACCESS_KEY: ${REHEARSAL_CODEX_MINIO_ROOT_USER:-nexus-rehearsal}
      S3_SECRET_KEY: ${REHEARSAL_CODEX_MINIO_ROOT_PASSWORD:-nexus-rehearsal}
      JWT_SECRET: ${REHEARSAL_CODEX_JWT_SECRET:-nexus-migration-phase3-e078895-codex-jwt}
    networks: !override [rehearsal-net]
  doc-processor:
    environment:
      DATABASE_URL: postgresql://${REHEARSAL_CODEX_POSTGRES_USER:-nexus-rehearsal}:${REHEARSAL_CODEX_POSTGRES_PASSWORD:-nexus-rehearsal}@codex-postgres:5432/${REHEARSAL_CODEX_POSTGRES_DB:-doclib_rehearsal}
      REDIS_URL: redis://:${REHEARSAL_CODEX_REDIS_PASSWORD:-nexus-rehearsal}@codex-redis:6379
      S3_ACCESS_KEY: ${REHEARSAL_CODEX_MINIO_ROOT_USER:-nexus-rehearsal}
      S3_SECRET_KEY: ${REHEARSAL_CODEX_MINIO_ROOT_PASSWORD:-nexus-rehearsal}
      JWT_SECRET: ${REHEARSAL_CODEX_JWT_SECRET:-nexus-migration-phase3-e078895-codex-jwt}
    networks: !override [rehearsal-net]
  doc-websocket:
    environment:
      DATABASE_URL: postgresql://${REHEARSAL_CODEX_POSTGRES_USER:-nexus-rehearsal}:${REHEARSAL_CODEX_POSTGRES_PASSWORD:-nexus-rehearsal}@codex-postgres:5432/${REHEARSAL_CODEX_POSTGRES_DB:-doclib_rehearsal}
      REDIS_URL: redis://:${REHEARSAL_CODEX_REDIS_PASSWORD:-nexus-rehearsal}@codex-redis:6379
      JWT_SECRET: ${REHEARSAL_CODEX_JWT_SECRET:-nexus-migration-phase3-e078895-codex-jwt}
    networks: !override [rehearsal-net]
  admin-ui:
    networks: !override [rehearsal-net]
  dm-ui:
    networks: !override [rehearsal-net]

networks:
  homelab-net: !reset {}
  rehearsal-net:
    name: nexus-migration-phase3-e078895-net
    internal: true

volumes:
  codex-postgres-data: !reset {}
  codex-redis-data: !reset {}
  codex-elasticsearch-data: !reset {}
  codex-minio-data: !reset {}
  rehearsal-vtt-postgres-data: { name: nexus-migration-phase3-e078895-vtt-postgres-data }
  rehearsal-vtt-redis-data: { name: nexus-migration-phase3-e078895-vtt-redis-data }
  rehearsal-assets: { name: nexus-migration-phase3-e078895-assets }
  rehearsal-user-assets: { name: nexus-migration-phase3-e078895-user-assets }
  rehearsal-library-assets: { name: nexus-migration-phase3-e078895-library-assets }
  rehearsal-tmt-seed: { name: nexus-migration-phase3-e078895-tmt-seed }
  rehearsal-codex-postgres-data: { name: nexus-migration-phase3-e078895-codex-postgres-data }
  rehearsal-codex-redis-data: { name: nexus-migration-phase3-e078895-codex-redis-data }
  rehearsal-codex-elasticsearch-data: { name: nexus-migration-phase3-e078895-codex-elasticsearch-data }
  rehearsal-codex-minio-data: { name: nexus-migration-phase3-e078895-codex-minio-data }
