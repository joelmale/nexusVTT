# Custom postgres_exporter queries for measurements the default collector set
# does not expose: long-running queries and blocked lock waiters (Phase 3,
# see apps/docs/platform/observability-runbook.md). Mounted read-only into the
# postgres_exporter container and loaded with --extend.query-path.
#
# Requires the nexus_monitor role documented in the runbook (pg_monitor +
# CONNECT), which is enough to read pg_stat_activity/pg_locks for every
# backend, not just its own.

pg_long_running_queries:
  query: |
    SELECT count(*) AS count
    FROM pg_stat_activity
    WHERE state != 'idle'
      AND query_start IS NOT NULL
      AND now() - query_start > interval '5 minutes'
  metrics:
    - count:
        usage: "GAUGE"
        description: "Backends running a query for longer than 5 minutes"

pg_blocked_locks:
  query: |
    SELECT count(DISTINCT blocked_locks.pid) AS count
    FROM pg_locks blocked_locks
    JOIN pg_locks blocking_locks
      ON blocking_locks.locktype = blocked_locks.locktype
     AND blocking_locks.database IS NOT DISTINCT FROM blocked_locks.database
     AND blocking_locks.relation IS NOT DISTINCT FROM blocked_locks.relation
     AND blocking_locks.page IS NOT DISTINCT FROM blocked_locks.page
     AND blocking_locks.tuple IS NOT DISTINCT FROM blocked_locks.tuple
     AND blocking_locks.transactionid IS NOT DISTINCT FROM blocked_locks.transactionid
     AND blocking_locks.classid IS NOT DISTINCT FROM blocked_locks.classid
     AND blocking_locks.objid IS NOT DISTINCT FROM blocked_locks.objid
     AND blocking_locks.objsubid IS NOT DISTINCT FROM blocked_locks.objsubid
     AND blocking_locks.pid != blocked_locks.pid
    WHERE NOT blocked_locks.granted
  metrics:
    - count:
        usage: "GAUGE"
        description: "Distinct backends currently waiting on a lock held by another backend"
