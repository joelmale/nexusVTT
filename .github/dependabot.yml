version: 2
updates:
  # JavaScript dependencies
  - package-ecosystem: "npm"
    directory: "/apps/vtt"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "JoelN" # Update with your GitHub username
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "vite*"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "vite*"
          - "@vitejs/*"
        update-types:
          - "patch"
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/apps/vtt/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    reviewers:
      - "JoelN"

  # Imported application install roots remain independent during migration.
  - package-ecosystem: "npm"
    directory: "/apps/forge"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "JoelN"

  - package-ecosystem: "npm"
    directory: "/apps/codex/services/doc-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "JoelN"

  - package-ecosystem: "npm"
    directory: "/apps/codex/services/doc-processor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "JoelN"

  - package-ecosystem: "npm"
    directory: "/apps/codex/services/doc-websocket"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "JoelN"

  - package-ecosystem: "npm"
    directory: "/apps/codex/services/admin-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "JoelN"

  - package-ecosystem: "npm"
    directory: "/apps/codex/services/dm-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "JoelN"

  - package-ecosystem: "npm"
    directory: "/apps/codex/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "JoelN"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    reviewers:
      - "JoelN"
