version: 2
updates:
  # npm owns one lockfile at the repository root. Dependabot must resolve every
  # workspace from that root so manifest and lockfile changes stay atomic.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'JoelN'
    groups:
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/client'
      docusaurus:
        patterns:
          - '@docusaurus/*'
      typescript-tooling:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'globals'
          - 'vite'
          - '@vitejs/*'
      test-tooling:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
          - '@testing-library/*'
          - '@types/jest'
          - '@types/node'
          - '@types/supertest'
      codex-runtime:
        patterns:
          - '@elastic/elasticsearch'
          - 'bullmq'
          - 'ioredis'
          - 'zod'
      development-updates:
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      production-patches:
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'patch'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'docker'
    directory: '/apps/vtt/docker'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    reviewers:
      - 'JoelN'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    reviewers:
      - 'JoelN'
