name: CI Pipeline

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: >-
    pr-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26.5.1'

defaults:
  run:
    working-directory: apps/vtt

jobs:
  changes:
    name: Detect changed workspaces
    runs-on: ubuntu-latest
    outputs:
      vtt: ${{ steps.affected.outputs.vtt }}
      assets: ${{ steps.affected.outputs.assets }}
      forge: ${{ steps.affected.outputs.forge }}
      codex: ${{ steps.affected.outputs.codex }}
      docs: ${{ steps.affected.outputs.docs }}
      control_api: ${{ steps.affected.outputs.control_api }}
      gateway: ${{ steps.affected.outputs.gateway }}
      codex_node_matrix: ${{ steps.affected.outputs.codex_node_matrix }}
      codex_python_matrix: ${{ steps.affected.outputs.codex_python_matrix }}
      has_codex_node: ${{ steps.affected.outputs.has_codex_node }}
      has_codex_python: ${{ steps.affected.outputs.has_codex_python }}
      codex_doc_api: ${{ steps.affected.outputs.codex_doc_api }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout exact validation source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve validation source
        id: source
        shell: bash
        working-directory: ${{ github.workspace }}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate service catalog
        working-directory: ${{ github.workspace }}
        run: node scripts/ci/service-catalog.mjs

      - name: Resolve affected targets
        id: affected
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'HEAD^' }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_REF: ${{ github.ref }}
        run: |
          mkdir -p ci-reports
          node scripts/ci/affected-targets.mjs \
            --base "${BASE_SHA:-HEAD^}" \
            --head HEAD \
            --event "$EVENT_NAME" \
            --ref "$VALIDATION_REF" \
            --json-file ci-reports/affected-targets.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload affected-target report
        uses: actions/upload-artifact@v7
        with:
          name: affected-targets-${{ steps.source.outputs.sha }}
          path: ci-reports/affected-targets.json
          if-no-files-found: error
          retention-days: 30

  repository-contracts:
    name: Repository CI contracts
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Validate workspace lockfile
        run: npm run check:workspace-lock
        working-directory: ${{ github.workspace }}

      - name: Validate service catalog
        run: npm run check:service-catalog
        working-directory: ${{ github.workspace }}

      - name: Validate Docker build contracts
        run: npm run check:docker-build-contracts
        working-directory: ${{ github.workspace }}

      - name: Run CI contract tests
        run: npm run test:ci-contracts
        working-directory: ${{ github.workspace }}

      - name: Validate GitHub Actions workflows
        run: npm run check:workflows
        working-directory: ${{ github.workspace }}

  vtt-static:
    name: 'VTT: lint, type-check, and build'
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.vtt == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build shared contracts
        run: npm run build:contracts
        working-directory: ${{ github.workspace }}

      - name: Run ESLint
        run: npm run lint --workspace=nexus-vtt

      - name: Run TypeScript type check
        run: npm run type-check --workspace=nexus-vtt

      - name: Check import cycles
        run: npm run check:cycles --workspace=nexus-vtt

      - name: Verify dice assets
        run: npm run check:dice-assets --workspace=nexus-vtt

      - name: Build client and server
        run: npm run build:all --workspace=nexus-vtt

  vtt-unit:
    name: 'VTT: unit tests (${{ matrix.shard }}/3)'
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.vtt == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build shared contracts
        run: npm run build:contracts
        working-directory: ${{ github.workspace }}

      - name: Run unit test shard
        run: npm run test:unit -- --shard=${{ matrix.shard }}/3
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

  asset-service:
    name: 'VTT: asset-service tests'
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.assets == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build shared contracts
        run: npm run build:contracts
        working-directory: ${{ github.workspace }}

      - name: Run asset-service tests
        run: npm run test:asset-service

  gateway-contracts:
    name: 'VTT: gateway route matrix'
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.gateway == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Run gateway route matrix
        run: bash scripts/ci/gateway-route-matrix.sh
        working-directory: ${{ github.workspace }}

  control-api:
    name: 'Control API: validation'
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.control_api == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build shared contracts
        run: npm run build:contracts
        working-directory: ${{ github.workspace }}

      - name: Lint
        run: npm run lint --workspace=nexus-control-api
        working-directory: ${{ github.workspace }}

      - name: Type-check
        run: npm run type-check --workspace=nexus-control-api
        working-directory: ${{ github.workspace }}

      - name: Test
        run: npm run test --workspace=nexus-control-api
        working-directory: ${{ github.workspace }}

  forge:
    name: Forge
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.forge == 'true'
    needs: changes
    uses: ./.github/workflows/forge-ci.yml
    with:
      source_sha: ${{ needs.changes.outputs.source_sha }}

  codex:
    name: Codex
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.codex == 'true'
    needs: changes
    uses: ./.github/workflows/codex-ci.yml
    with:
      source_sha: ${{ needs.changes.outputs.source_sha }}
      run_doc_api: ${{ needs.changes.outputs.codex_doc_api == 'true' }}
      run_integration: false
      has_node_services: ${{ needs.changes.outputs.has_codex_node == 'true' }}
      node_services: ${{ needs.changes.outputs.codex_node_matrix }}
      has_python_services: ${{ needs.changes.outputs.has_codex_python == 'true' }}
      python_services: ${{ needs.changes.outputs.codex_python_matrix }}

  docs:
    name: Documentation checks
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Type-check and build documentation
        run: npm run test:docs
        working-directory: ${{ github.workspace }}

  required:
    name: All required checks
    if: always()
    needs:
      - changes
      - repository-contracts
      - vtt-static
      - vtt-unit
      - asset-service
      - gateway-contracts
      - control-api
      - forge
      - codex
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every expected PR validation
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          VTT_AFFECTED: ${{ needs.changes.outputs.vtt }}
          ASSETS_AFFECTED: ${{ needs.changes.outputs.assets }}
          GATEWAY_AFFECTED: ${{ needs.changes.outputs.gateway }}
          CONTROL_API_AFFECTED: ${{ needs.changes.outputs.control_api }}
          FORGE_AFFECTED: ${{ needs.changes.outputs.forge }}
          CODEX_AFFECTED: ${{ needs.changes.outputs.codex }}
          DOCS_AFFECTED: ${{ needs.changes.outputs.docs }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTRACTS_RESULT: ${{ needs.repository-contracts.result }}
          VTT_STATIC_RESULT: ${{ needs.vtt-static.result }}
          VTT_UNIT_RESULT: ${{ needs.vtt-unit.result }}
          ASSET_RESULT: ${{ needs.asset-service.result }}
          GATEWAY_RESULT: ${{ needs.gateway-contracts.result }}
          CONTROL_API_RESULT: ${{ needs.control-api.result }}
          FORGE_RESULT: ${{ needs.forge.result }}
          CODEX_RESULT: ${{ needs.codex.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          [[ "$CHANGES_RESULT" == 'success' ]]
          [[ "$CONTRACTS_RESULT" == 'success' ]]

          require_result() {
            local target=$1 affected=$2 result=$3
            local expected='success'
            if [[ "$EVENT_NAME" != 'workflow_dispatch' && "$affected" != 'true' ]]; then
              expected='skipped'
            fi
            if [[ "$result" != "$expected" ]]; then
              echo "$target result was $result; expected $expected" >&2
              exit 1
            fi
          }

          require_result vtt-static "$VTT_AFFECTED" "$VTT_STATIC_RESULT"
          require_result vtt-unit "$VTT_AFFECTED" "$VTT_UNIT_RESULT"
          require_result asset-service "$ASSETS_AFFECTED" "$ASSET_RESULT"
          require_result gateway "$GATEWAY_AFFECTED" "$GATEWAY_RESULT"
          require_result control-api "$CONTROL_API_AFFECTED" "$CONTROL_API_RESULT"
          require_result forge "$FORGE_AFFECTED" "$FORGE_RESULT"
          require_result codex "$CODEX_AFFECTED" "$CODEX_RESULT"
          require_result docs "$DOCS_AFFECTED" "$DOCS_RESULT"
