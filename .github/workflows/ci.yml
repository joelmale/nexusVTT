name: CI Pipeline

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '26.5.0'

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Check import cycles
        run: npm run check:cycles

      - name: Verify dice assets
        run: npm run check:dice-assets

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --shard=${{ matrix.shard }}/3
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

  asset-service-tests:
    name: Asset Service Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run asset service tests
        run: npm run test:asset-service

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run integration tests with Docker Compose
        run: docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test

      - name: Teardown Docker Compose
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  e2e-smoke:
    name: Production E2E Smoke
    runs-on: ubuntu-latest
    needs: lint-and-type
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [unit-tests, asset-service-tests, integration-tests, e2e-smoke]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # Generate version tag
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(date +%Y%m%d)-${SHORT_SHA}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/joelmale/nexusvtt/frontend:${{ steps.meta.outputs.version }}
            ghcr.io/joelmale/nexusvtt/frontend:latest
          cache-from: type=gha,scope=frontend-homelab
          cache-to: type=gha,mode=max,scope=frontend-homelab
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/joelmale/nexusvtt/backend:${{ steps.meta.outputs.version }}
            ghcr.io/joelmale/nexusvtt/backend:latest
          cache-from: type=gha,scope=backend-homelab
          cache-to: type=gha,mode=max,scope=backend-homelab
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

      - name: Build and push asset service
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/asset-service.Dockerfile
          push: true
          tags: |
            ghcr.io/joelmale/nexusvtt/asset-service:${{ steps.meta.outputs.version }}
            ghcr.io/joelmale/nexusvtt/asset-service:latest
          cache-from: type=gha,scope=asset-service-homelab
          cache-to: type=gha,mode=max,scope=asset-service-homelab

      - name: Build and push postgres
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/postgres.Dockerfile
          push: true
          tags: |
            ghcr.io/joelmale/nexusvtt/postgres:${{ steps.meta.outputs.version }}
            ghcr.io/joelmale/nexusvtt/postgres:latest
          cache-from: type=gha,scope=postgres-homelab
          cache-to: type=gha,mode=max,scope=postgres-homelab
