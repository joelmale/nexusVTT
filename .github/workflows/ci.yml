name: CI Pipeline

on:
  push:
    branches: [master]
    tags:
      - 'v*'
    paths:
      - 'apps/vtt/**'
      - 'deploy/**'
      - 'monitoring/**'
      - '.github/workflows/ci.yml'
      - '.husky/**'
      - 'Makefile'
      - 'package.json'
  pull_request:
    branches: [master]
    paths:
      - 'apps/vtt/**'
      - 'deploy/**'
      - 'monitoring/**'
      - '.github/workflows/ci.yml'
      - '.husky/**'
      - 'Makefile'
      - 'package.json'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character commit SHA to publish as candidate-only images'
        required: false
        type: string

env:
  NODE_VERSION: '26.5.0'

defaults:
  run:
    working-directory: apps/vtt

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/vtt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Check import cycles
        run: npm run check:cycles

      - name: Verify dice assets
        run: npm run check:dice-assets

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/vtt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --shard=${{ matrix.shard }}/3
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

  asset-service-tests:
    name: Asset Service Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/vtt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run asset service tests
        run: npm run test:asset-service

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run integration tests with Docker Compose
        run: docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test

      - name: Teardown Docker Compose
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  e2e-smoke:
    name: Production E2E Smoke
    runs-on: ubuntu-latest
    needs: lint-and-type
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/vtt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: |
            apps/vtt/playwright-report/
            apps/vtt/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [unit-tests, asset-service-tests, integration-tests, e2e-smoke]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.candidate_sha == '')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # Generate version tag
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(date +%Y%m%d)-${SHORT_SHA}
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./apps/vtt
          file: ./apps/vtt/docker/frontend.Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/joelmale/nexusvtt/frontend:${{ steps.meta.outputs.version }}
            ghcr.io/joelmale/nexusvtt/frontend:latest
          cache-from: type=gha,scope=frontend-homelab
          cache-to: type=gha,mode=max,scope=frontend-homelab
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./apps/vtt
          file: ./apps/vtt/docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/joelmale/nexusvtt/backend:${{ steps.meta.outputs.version }}
            ghcr.io/joelmale/nexusvtt/backend:latest
          cache-from: type=gha,scope=backend-homelab
          cache-to: type=gha,mode=max,scope=backend-homelab
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

      - name: Build and push asset service
        uses: docker/build-push-action@v7
        with:
          context: ./apps/vtt
          file: ./apps/vtt/docker/asset-service.Dockerfile
          push: true
          tags: |
            ghcr.io/joelmale/nexusvtt/asset-service:${{ steps.meta.outputs.version }}
            ghcr.io/joelmale/nexusvtt/asset-service:latest
          cache-from: type=gha,scope=asset-service-homelab
          cache-to: type=gha,mode=max,scope=asset-service-homelab
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

      - name: Build and push postgres
        uses: docker/build-push-action@v7
        with:
          context: ./apps/vtt
          file: ./apps/vtt/docker/postgres.Dockerfile
          push: true
          tags: |
            ghcr.io/joelmale/nexusvtt/postgres:${{ steps.meta.outputs.version }}
            ghcr.io/joelmale/nexusvtt/postgres:latest
          cache-from: type=gha,scope=postgres-homelab
          cache-to: type=gha,mode=max,scope=postgres-homelab
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

  candidate-images:
    name: Candidate ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vtt-frontend
            context: ./apps/vtt
            file: ./apps/vtt/docker/frontend.Dockerfile
            image: ghcr.io/joelmale/nexusvtt/frontend
          - name: vtt-backend
            context: ./apps/vtt
            file: ./apps/vtt/docker/backend.Dockerfile
            image: ghcr.io/joelmale/nexusvtt/backend
          - name: vtt-asset-service
            context: ./apps/vtt
            file: ./apps/vtt/docker/asset-service.Dockerfile
            image: ghcr.io/joelmale/nexusvtt/asset-service
          - name: vtt-postgres
            context: ./apps/vtt
            file: ./apps/vtt/docker/postgres.Dockerfile
            image: ghcr.io/joelmale/nexusvtt/postgres
          - name: forge
            context: ./apps/forge
            file: ./apps/forge/Dockerfile
            image: ghcr.io/joelmale/nexus-forge
          - name: codex-doc-api
            context: ./apps/codex/services/doc-api
            file: ./apps/codex/services/doc-api/Dockerfile
            image: ghcr.io/joelmale/nexuscodex-doc-api
          - name: codex-doc-processor
            context: ./apps/codex/services/doc-processor
            file: ./apps/codex/services/doc-processor/Dockerfile
            image: ghcr.io/joelmale/nexuscodex-doc-processor
          - name: codex-doc-websocket
            context: ./apps/codex/services/doc-websocket
            file: ./apps/codex/services/doc-websocket/Dockerfile
            image: ghcr.io/joelmale/nexuscodex-doc-websocket
          - name: codex-admin-ui
            context: ./apps/codex/services/admin-ui
            file: ./apps/codex/services/admin-ui/Dockerfile
            image: ghcr.io/joelmale/nexuscodex-admin-ui
          - name: codex-dm-ui
            context: ./apps/codex/services/dm-ui
            file: ./apps/codex/services/dm-ui/Dockerfile
            image: ghcr.io/joelmale/nexuscodex-dm-ui
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Verify exact candidate source
        id: source
        shell: bash
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          if [[ ! "${{ inputs.candidate_sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'candidate_sha must be a full lowercase 40-character Git SHA' >&2
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "${{ inputs.candidate_sha }}" ]]; then
            echo 'checked-out source does not match candidate_sha' >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable candidate
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.image }}:candidate-${{ steps.source.outputs.short_sha }}
          build-args: |
            VERSION=monorepo-${{ steps.source.outputs.short_sha }}
            COMMIT_SHA=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=candidate-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=candidate-${{ matrix.name }}
