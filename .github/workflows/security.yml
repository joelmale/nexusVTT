name: Release security wrapper

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA to scan
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-source:
    name: Resolve release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      security_images: ${{ steps.catalog.outputs.security_images }}
    steps:
      - name: Validate manual source syntax
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be a full lowercase 40-character Git SHA' >&2
            exit 1
          }

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_sha }}

      - name: Record exact source
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          source_sha=$(git rev-parse HEAD)
          if [[ -n "$REQUESTED_SHA" && "$source_sha" != "$REQUESTED_SHA" ]]; then
            echo 'checked-out source does not match source_sha' >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate service catalog and generate scan matrix
        id: catalog
        shell: bash
        run: |
          node scripts/ci/service-catalog.mjs
          node scripts/ci/affected-targets.mjs \
            --base HEAD^ \
            --head HEAD \
            --event release \
            --ref "$GITHUB_REF" \
            --full \
            --github-output "$GITHUB_OUTPUT" \
            --format summary

  security:
    name: Security validation
    needs: resolve-source
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security-reusable.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.sha }}
      repository_scan: true
      container_images: ${{ needs.resolve-source.outputs.security_images }}

  attach-release-sboms:
    name: Attach release SBOMs
    if: github.event_name == 'release'
    needs: [resolve-source, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download exact-run SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*-${{ needs.resolve-source.outputs.sha }}
          path: sboms
          merge-multiple: true

      - name: Attach SBOMs to the published release
        uses: softprops/action-gh-release@v3
        with:
          files: sboms/*.cdx.json
          fail_on_unmatched_files: true
