name: Codex CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Exact source SHA to verify'
        required: true
        type: string
      run_doc_api:
        description: 'Run the specialized doc-api unit validation'
        required: true
        type: boolean
      run_integration:
        description: 'Run database-backed Codex integration tests'
        required: false
        default: false
        type: boolean
      has_node_services:
        description: 'Whether the Node service matrix has entries'
        required: true
        type: boolean
      node_services:
        description: 'Catalog-generated Node service matrix'
        required: true
        type: string
      has_python_services:
        description: 'Whether the Python service matrix has entries'
        required: true
        type: boolean
      python_services:
        description: 'Catalog-generated Python service matrix'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-inventory:
    name: 'Codex: test inventory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify service test inventory
        run: node apps/codex/scripts/check-test-inventory.mjs

  verify-doc-api-unit:
    name: 'doc-api: unit tests and build'
    if: inputs.run_doc_api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/codex/services/doc-api
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_vtt_unit
      REDIS_URL: redis://localhost:6379
      ELASTICSEARCH_URL: http://localhost:9201
      ELASTICSEARCH_INDEX: codex-api-unit
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: codex-api-unit
      LOGGING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '26.5.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build shared contracts
        run: npm run build:contracts
        working-directory: ${{ github.workspace }}

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  verify-doc-api-integration:
    name: 'doc-api: API integration tests'
    if: inputs.run_doc_api && inputs.run_integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_vtt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_vtt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        # Must track deploy/homelab/compose.yaml. doc-api and doc-processor use
        # the @elastic/elasticsearch v9 client, which sends
        # `compatible-with=9` in its Content-Type. An 8.x server rejects that
        # with media_type_header_exception, so an 8.11.0 service container here
        # fails every integration test that touches the index.
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/codex/services/doc-api
    env:
      NODE_ENV: test
      REDIS_URL: redis://localhost:6380
      ELASTICSEARCH_URL: http://localhost:9201
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: codex-api-integration
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      AUTH_DISABLED: 'true'
      LOGGING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '26.5.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build shared contracts
        run: npm run build:contracts
        working-directory: ${{ github.workspace }}

      - name: Configure isolated integration resources
        id: resources
        shell: bash
        run: |
          test_schema="codex_api_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          search_index="codex-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "TEST_SCHEMA=${test_schema}"
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5433/nexus_vtt_test?schema=${test_schema}"
            echo "ELASTICSEARCH_INDEX=${search_index}"
          } >> "${GITHUB_ENV}"

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Initialize isolated test database
        run: npx prisma db push --skip-generate

      - name: Run API integration tests
        run: npm run test:integration -- --reporter=verbose

      - name: Clean isolated integration resources
        if: always() && steps.resources.outcome == 'success'
        shell: bash
        run: |
          if [[ -z "${TEST_SCHEMA:-}" || -z "${ELASTICSEARCH_INDEX:-}" ]]; then
            echo "Isolated resource names were not configured; refusing broad cleanup." >&2
            exit 1
          fi

          database_status=0
          search_status=0
          printf 'DROP SCHEMA IF EXISTS "%s" CASCADE;\n' "${TEST_SCHEMA}" \
            | npx prisma db execute --stdin --url "${DATABASE_URL}" \
            || database_status=$?
          curl --silent --show-error --request DELETE \
            "${ELASTICSEARCH_URL}/${ELASTICSEARCH_INDEX}" \
            || search_status=$?

          if (( database_status != 0 || search_status != 0 )); then
            echo "Integration cleanup failed (database=${database_status}, search=${search_status})." >&2
            exit 1
          fi

  verify-services:
    name: '${{ matrix.service }}: validation'
    if: inputs.has_node_services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.node_services) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '26.5.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build shared contracts
        run: npm run build:contracts
        working-directory: ${{ github.workspace }}

      - name: Generate Prisma client
        if: matrix.prisma
        run: npm run prisma:generate
        working-directory: ${{ matrix.directory }}

      - name: Run existing tests
        if: matrix.test
        run: npm test
        working-directory: ${{ matrix.directory }}

      - name: Run UI lint
        if: matrix.lint
        run: npm run lint
        working-directory: ${{ matrix.directory }}

      - name: Build
        if: matrix.build
        run: npm run build
        working-directory: ${{ matrix.directory }}

  verify-python-services:
    name: '${{ matrix.service }}: unit tests and validation'
    if: inputs.has_python_services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.python_services) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
        working-directory: ${{ matrix.directory }}

      - name: Run unit tests
        run: python -m pytest --quiet
        working-directory: ${{ matrix.directory }}

      - name: Compile Python sources
        run: python -m compileall -q src
        working-directory: ${{ matrix.directory }}
