name: Forge CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Exact source SHA to verify'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact source SHA to verify'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/forge

jobs:
  verify:
    name: type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '26.5.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build shared contracts
        run: npm run build:contracts
        working-directory: ${{ github.workspace }}

      - name: Type check
        run: npm exec tsc -- --noEmit

      - name: Lint
        run: npm run lint

      - name: Test with existing coverage gates
        run: npm test -- --run --coverage

      - name: Production build
        run: npm run build

  build-image:
    name: image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/forge/Dockerfile
          push: false
          tags: nexus-forge:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=forge
          cache-to: type=gha,mode=max,scope=forge
