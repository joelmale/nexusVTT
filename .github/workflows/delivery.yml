name: Delivery Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full SHA for the current main commit
        required: false
        type: string

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: '26.5.1'

jobs:
  resolve:
    name: Resolve delivery manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      docs: ${{ steps.affected.outputs.docs }}
      release_images: ${{ steps.affected.outputs.release_images }}
      security_images: ${{ steps.affected.outputs.security_images }}
      all_release_images: ${{ steps.affected.outputs.all_release_images }}
      has_release_images: ${{ steps.affected.outputs.has_release_images }}
    steps:
      - name: Validate manual source syntax
        if: github.event_name == 'workflow_dispatch' && inputs.source_sha != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be a full lowercase 40-character Git SHA' >&2
            exit 1
          }

      - name: Checkout delivery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Verify source belongs to main
        id: source
        shell: bash
        env:
          PUSH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          source_sha=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main || {
            echo 'delivery source must be reachable from main' >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$source_sha" != "$(git rev-parse origin/main)" ]]; then
            echo 'manual candidate source must equal current main' >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_SHA" && "$source_sha" != "$REQUESTED_SHA" ]]; then
            echo 'checked-out source does not match source_sha' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$source_sha" != "$PUSH_SHA" ]]; then
            echo 'checked-out source does not match the pushed commit' >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate service catalog
        run: node scripts/ci/service-catalog.mjs

      - name: Resolve affected delivery targets
        id: affected
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before || 'HEAD^' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          node scripts/ci/affected-targets.mjs \
            --base "${BASE_SHA:-HEAD^}" \
            --head HEAD \
            --event "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --github-output "$GITHUB_OUTPUT" \
            --format summary

  validation-evidence:
    name: Verify exact-source validation
    needs: resolve
    outputs:
      run_id: ${{ steps.validation.outputs.run_id }}
      run_url: ${{ steps.validation.outputs.run_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout delivery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Require successful CI for the exact source
        id: validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_VALIDATION_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push' }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          VALIDATION_POLL_MS: '15000'
          VALIDATION_WAIT_MS: '2400000'
        run: node scripts/ci/release-validation-evidence.mjs

  security:
    name: Verify exact-source security
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.validation-evidence.result == 'success' &&
      (needs.publish-images.result == 'success' || needs.publish-images.result == 'skipped')
    needs: [resolve, validation-evidence, publish-images]
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/security-reusable.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      # CodeQL and the filesystem scan already ran on this exact commit in CI,
      # and validation-evidence requires that run to be green. Delivery only
      # needs to scan the published images.
      repository_scan: false
      container_images: ${{ needs.resolve.outputs.security_images }}
      prebuilt_tag_prefix: ${{ github.event_name == 'workflow_dispatch' && 'candidate' || 'sha' }}

  publish-images:
    name: 'Publish immutable image: ${{ matrix.name }}'
    if: needs.resolve.outputs.has_release_images == 'true'
    needs: [resolve, validation-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.release_images) }}
    steps:
      - name: Checkout delivery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Set up QEMU for multi-platform images
        if: contains(matrix.platforms, ',')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable publication tag
        id: image-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ matrix.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          prefix=sha
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            prefix=candidate
          fi
          echo "tag=$REPOSITORY:$prefix-$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable source image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.image-tag.outputs.tag }}
          # codex-ocr (multi-GB CUDA/torch layers) caches in GHCR. Exporting it to
          # the GitHub Actions cache took ~14 minutes per build and the 10 GB
          # repository cap evicts it before the next run. Other images are unchanged.
          cache-from: ${{ matrix.name == 'codex-ocr' && format('type=registry,ref={0}:buildcache', matrix.repository) || format('type=gha,scope=release-{0}', matrix.name) }}
          cache-to: ${{ matrix.name == 'codex-ocr' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', matrix.repository) || format('type=gha,mode=max,scope=release-{0}', matrix.name) }}
          build-args: |
            VERSION=sha-${{ needs.resolve.outputs.source_sha }}
            COMMIT_SHA=${{ needs.resolve.outputs.source_sha }}

  promote-release:
    name: Promote immutable image digests
    if: needs.publish-images.result == 'success'
    needs: [resolve, publish-images, security]
    outputs:
      disposition: ${{ steps.eligibility.outputs.disposition }}
      publication: ${{ steps.promotion.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: nexus-release-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout delivery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0

      - name: Check release promotion eligibility
        id: eligibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: node scripts/ci/release-promotion.mjs

      - name: Set up Docker Buildx
        if: steps.eligibility.outputs.disposition == 'eligible'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: steps.eligibility.outputs.disposition == 'eligible'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote digests and write release manifest
        id: promotion
        if: steps.eligibility.outputs.disposition == 'eligible'
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          AFFECTED_RELEASE_IMAGES: ${{ needs.resolve.outputs.release_images }}
          ALL_RELEASE_IMAGES: ${{ needs.resolve.outputs.all_release_images }}
        run: |
          version=$(date -u +%Y%m%d)-${SOURCE_SHA:0:7}
          mkdir -p release
          printf '{"schemaVersion":1,"sourceSha":"%s","images":[' "$SOURCE_SHA" > release/images.json
          separator=''
          while IFS=$'\t' read -r image repository; do
            changed=false
            source="$repository:latest"
            tags=(--tag "$repository:$version")
            if jq -e --arg image "$image" '.[] | select(.name == $image)' \
              <<< "$AFFECTED_RELEASE_IMAGES" >/dev/null; then
              changed=true
              source="$repository:sha-$SOURCE_SHA"
              tags+=(--tag "$repository:latest")
            fi
            digest=$(docker buildx imagetools inspect "$source" | awk '/^Digest:/ && !d {d=$2} END {print d}')
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "could not resolve digest for $source" >&2
              exit 1
            fi
            docker buildx imagetools create "${tags[@]}" "$repository@$digest"
            printf '%s{"name":"%s","source":"%s","digest":"%s","changed":%s}' \
              "$separator" "$image" "$source" "$digest" "$changed" >> release/images.json
            separator=','
          done < <(jq -r '.[] | [.name, .repository] | @tsv' <<< "$ALL_RELEASE_IMAGES")
          printf '],"version":"%s"}\n' "$version" >> release/images.json

      - name: Upload complete image manifest
        if: steps.eligibility.outputs.disposition == 'eligible'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-images-${{ needs.resolve.outputs.source_sha }}
          path: release/images.json
          if-no-files-found: error
          retention-days: 90

  build-docs:
    name: Stage validated documentation artifact
    if: github.event_name == 'push' && needs.resolve.outputs.docs == 'true'
    needs: [resolve, validation-evidence, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact validation Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: github-pages
          path: validated-pages
          run-id: ${{ needs.validation-evidence.outputs.run_id }}

      - name: Re-stage exact validated Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-pages
          path: validated-pages/
          if-no-files-found: error
          retention-days: 7

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && needs.build-docs.result == 'success'
    needs: [resolve, validation-evidence, security, build-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  result:
    name: Delivery result
    if: always()
    needs:
      - resolve
      - validation-evidence
      - security
      - publish-images
      - promote-release
      - build-docs
      - deploy-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify delivery outcomes
        shell: bash
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          VALIDATION_RESULT: ${{ needs.validation-evidence.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          HAS_IMAGES: ${{ needs.resolve.outputs.has_release_images }}
          DOCS_AFFECTED: ${{ needs.resolve.outputs.docs }}
          PUBLISH_RESULT: ${{ needs.publish-images.result }}
          PROMOTION_RESULT: ${{ needs.promote-release.result }}
          PROMOTION_DISPOSITION: ${{ needs.promote-release.outputs.disposition }}
          PUBLICATION_RESULT: ${{ needs.promote-release.outputs.publication }}
          BUILD_DOCS_RESULT: ${{ needs.build-docs.result }}
          DEPLOY_DOCS_RESULT: ${{ needs.deploy-docs.result }}
        run: |
          [[ "$RESOLVE_RESULT" == 'success' ]]
          [[ "$VALIDATION_RESULT" == 'success' ]]
          [[ "$SECURITY_RESULT" == 'success' ]]

          if [[ "$HAS_IMAGES" == 'true' ]]; then
            [[ "$PUBLISH_RESULT" == 'success' ]]
            [[ "$PROMOTION_RESULT" == 'success' ]]
            case "$PROMOTION_DISPOSITION:$PUBLICATION_RESULT" in
              eligible:success|superseded:skipped|candidate:skipped) ;;
              *)
                echo "unexpected promotion outcome: $PROMOTION_DISPOSITION:$PUBLICATION_RESULT" >&2
                exit 1
                ;;
            esac
          else
            [[ "$PUBLISH_RESULT" == 'skipped' ]]
            [[ "$PROMOTION_RESULT" == 'skipped' ]]
          fi

          if [[ "$DOCS_AFFECTED" == 'true' && "$GITHUB_EVENT_NAME" == 'push' ]]; then
            [[ "$BUILD_DOCS_RESULT" == 'success' ]]
            [[ "$DEPLOY_DOCS_RESULT" == 'success' ]]
          else
            [[ "$BUILD_DOCS_RESULT" == 'skipped' ]]
            [[ "$DEPLOY_DOCS_RESULT" == 'skipped' ]]
          fi
