# Test Docker Compose configuration
# Run tests with: docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit

services:
  test:
    # Debian, not Alpine. The full workspace install pulls in doc-processor's
    # canvas, which publishes no musl prebuild -- on Alpine it falls back to a
    # node-gyp source build and dies for want of Python. The install must stay
    # unscoped: vitest is hoisted to the root and resolves jsdom upward from
    # there, so omitting any workspace that supplies it breaks the suite.
    image: node:26.5.1-bookworm-slim
    # HOST_WORKSPACE, when set (CI sets it to `github.workspace`), mounts the
    # repo at the SAME absolute path inside the container as it has on the
    # runner. Vitest resolves the `@/...` aliases via `path.resolve(__dirname,
    # ...)`, so v8 coverage records frontend files under whatever absolute
    # path apps/vtt sits at when the process runs. If that path differs from
    # the unit-test shards' runner path (the old default, a container-local
    # /workspace), `vitest --merge-reports` cannot recognize the two as the
    # same file and double-counts every src/ file in the aggregate coverage
    # report. Local `docker compose` runs (no HOST_WORKSPACE) keep the old
    # /workspace default.
    working_dir: ${HOST_WORKSPACE:-/workspace}
    command: >-
      sh -c "npm ci --prefer-offline && npm run build:contracts &&
      npm run test:integration --workspace=nexus-vtt -- $${VITEST_CI_ARGS:-}"
    volumes:
      - ${HOST_WORKSPACE:-../../../}:${HOST_WORKSPACE:-/workspace}
      - ${HOST_WORKSPACE:-/workspace}/node_modules
    environment:
      - NODE_ENV=test
      - CI=true
      - DATABASE_URL=postgres://testuser:testpass@postgres-test:5432/testdb
      - JWT_SECRET=test-secret
      - VITEST_CI_ARGS=${VITEST_CI_ARGS:-}
    networks:
      - nexus-test
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=testdb
    networks:
      - nexus-test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testuser -d testdb']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'

networks:
  nexus-test:
    driver: bridge
