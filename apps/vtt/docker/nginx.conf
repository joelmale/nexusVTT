user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # nginx defaults to 1M, which rejects generated map / asset uploads well
    # under the backend's own multer limit (15MB, see
    # server/routes/generatedMaps.ts). Match that here with headroom so the
    # proxy never becomes the tighter limit.
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-javascript text/x-cross-domain-policy application/x-font-ttf 
               application/x-font-opentype application/vnd.ms-fontobject 
               image/x-icon;

    # Caching
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    max;
        ~font/                     max;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        resolver 127.0.0.11 valid=10s;
        absolute_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        #
        # script-src carries a sha256 for the theme pre-warming script inlined in
        # index.html. It must run before first paint to avoid a flash of unstyled
        # content, so it cannot move into a bundle. If that script is EDITED the
        # hash stops matching and it is silently blocked again -- regenerate it
        # with:
        #   openssl dgst -sha256 -binary <script.js> | openssl base64
        # worker-src allows blob: because the 3D dice engine (Babylon/dice-box)
        # spawns its physics worker from a blob URL; without it the worker is
        # blocked by the script-src fallback.
        # Cloudflare Web Analytics injects its beacon at the edge in production;
        # allow only that script host instead of relaxing inline script policy.
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self' ws: wss: http: https: data: blob: 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com 'sha256-kCY+4vzR5hFkTgOiL9nWFBV/YcxwM3P0hbskb/gD6oA='; worker-src 'self' blob:" always;

        # Cache control
        expires $expires;

        # Static assets (served from disk with fallback to asset-server)
        location /assets {
            root /usr/share/nginx/html;
            try_files $uri @asset_server;
            expires max;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self' ws: wss: http: https: data: blob: 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com 'sha256-kCY+4vzR5hFkTgOiL9nWFBV/YcxwM3P0hbskb/gD6oA='; worker-src 'self' blob:" always;
            access_log off;
        }

        location @asset_server {
            set $asset_server "http://asset-server:5003";
            proxy_pass $asset_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # WebSocket proxy configuration (Nexus VTT)
        location /ws {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Cookie and session support for WebSocket
            proxy_set_header Cookie $http_cookie;

            # WebSocket timeout
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Socket.io proxy configuration
        location /socket.io {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Cookie and session support
            proxy_set_header Cookie $http_cookie;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Codex WebSocket proxy configuration
        location /codex-ws {
            set $codex_ws "http://doc-websocket:3002";
            proxy_pass $codex_ws/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # NexusCodex on the PUBLIC vhost (Phase 0 of
        # apps/docs/platform/private-admin-control-plane.md).
        #
        # doc-api runs with AUTH_DISABLED=true, so anything nginx forwards to it
        # is fully privileged. Only the DM UI read allowlist below reaches it.
        # Admin, ingestion and processing surfaces are denied here and move to
        # the private admin vhost.
        #
        # The denials must be explicit: omitting them would let the generic
        # `/api` proxy forward these paths to the VTT backend instead. `^~`
        # stops the regex locations from overriding them. VTT's own
        # authenticated document BFF (/api/documents/:id, /content,
        # /structured-data, /api/search/*) stays on that `/api` proxy, and
        # `/process` is matched exactly so it cannot shadow those routes.
        location = /codex-admin { return 404; }
        location ^~ /codex-admin/ { return 404; }
        location ^~ /api/admin/ { return 404; }
        location = /api/documents/bulk { return 404; }
        location ^~ /api/documents/bulk/ { return 404; }
        location ~ ^/api/documents/[^/]+/process$ { return 404; }
        location ^~ /api/deduplication/ { return 404; }
        location ^~ /api/processing/ { return 404; }
        location ^~ /api/references/ { return 404; }
        location ^~ /api/annotations/ { return 404; }

        # Codex DM UI reads (apps/codex/services/dm-ui/src/services/codex-api.ts).
        # Only these GET paths reach doc-api, and only for a signed-in VTT
        # account; every other /codex-api/ path falls to the 404 below. The id
        # charset is restricted because proxy_pass with variables forwards the
        # captured path without re-escaping it.
        location ~ ^/codex-api(?<codex_api_path>/api/(?:search/quick|structured-data|documents/[A-Za-z0-9_-]+(?:/content)?))$ {
            limit_except GET { deny all; }
            auth_request /_vtt_session_check;
            set $doc_api "http://doc-api:3000";
            proxy_pass $doc_api$codex_api_path$is_args$args;
            # doc-api needs neither the VTT session cookie nor browser credentials.
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Must stay a plain prefix: `^~` would disable the allowlist regex.
        location /codex-api/ { return 404; }

        # auth_request target: 204 for a signed-in VTT account, 401 otherwise
        # (GET /auth/session-check). Forwards only the cookie, never the body.
        location = /_vtt_session_check {
            internal;
            set $backend "http://backend:5001";
            proxy_pass $backend/auth/session-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # VTT API proxy
        location /api {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Cookie and session support
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
        }

        # Auth proxy (OAuth routes)
        location /auth {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Cookie and session support
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
        }

        # TMT library metadata and content-addressed image assets.
        location /library {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /library-assets {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # The generator hub is a separate static app, NOT part of the SPA, and
        # GeneratorPanel loads it in an iframe from this same origin. Without
        # this block a missing or empty hub build falls through to the SPA
        # fallback below, the iframe boots a second copy of the VTT, and its
        # router sends that copy to /lobby -- which presents as "the Generator
        # pane shows the Lobby" rather than as a 404. This mirrors the
        # navigateFallbackDenylist already set in vite.config.ts, which nginx
        # has no way to know about.
        location /generator-hub/ {
            try_files $uri $uri/ =404;

            # The bundled generators are vendored Haxe/OpenFL builds whose
            # entry point is an inline <script> calling lime.embed(). The app's
            # script-src 'self' blocks it, so the 450KB payload downloads and
            # then never starts -- a blank panel with no network error. Hashes
            # were considered, but these files are regenerated wholesale by the
            # upstream tool, so a hash would break on every refresh.
            #
            # Relaxed HERE ONLY: the VTT app itself keeps the strict policy.
            # NOTE: add_header is not inherited once a block declares any of its
            # own, so every header the parent sets must be repeated here.
            add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
            include /etc/nginx/security-headers.conf;
        }

        # Character Forge — served directly from disk under /usr/share/nginx/html/forge/
        location = /forge {
            return 301 /forge/;
        }

        location /forge/ {
            try_files $uri $uri/ /forge/index.html;
        }

        # Codex runtime config stubs
        location = /config.js {
            return 200 "window.__NEXUSCODEX_CONFIG__ = {};\n";
            add_header Content-Type application/javascript;
        }

        location = /codex-dm/config.js {
            return 200 "window.__NEXUSCODEX_CONFIG__ = {};\n";
            add_header Content-Type application/javascript;
        }

        # Redirect legacy /codex paths to /codex-dm/
        location = /codex {
            return 301 /codex-dm/;
        }

        location /codex/ {
            return 301 /codex-dm/;
        }

        location = /codex-dm {
            return 301 /codex-dm/;
        }

        # Nexus Codex DM UI — served directly from disk under /usr/share/nginx/html/codex-dm/
        location /codex-dm/ {
            try_files $uri $uri/ /codex-dm/index.html;
        }

        # The service worker controls whether clients ever see a new build, so
        # it must never be served as immutable. The map above would otherwise
        # give it Cache-Control: max-age=1y; browsers cap worker freshness at
        # 24h, so a stale worker can keep serving old routing rules for a day
        # after a deploy.
        location = /sw.js {
            # `expires epoch` emits Cache-Control: no-cache on its own, which
            # is what a worker script wants: revalidate before use. Adding an
            # explicit add_header here would emit a second Cache-Control.
            expires epoch;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self' ws: wss: http: https: data: blob: 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com 'sha256-kCY+4vzR5hFkTgOiL9nWFBV/YcxwM3P0hbskb/gD6oA='; worker-src 'self' blob:" always;
        }
    }

    # PRIVATE admin listener (Phase 1 of
    # apps/docs/platform/private-admin-control-plane.md).
    #
    # Nginx Proxy Manager sends admin.internal.nexusvtt.com here, behind an
    # access list for the LAN and WireGuard subnets. The listener PORT is the
    # boundary, not server_name: the public proxy host targets :80, and no Host
    # header sent to :80 can select this block. Never publish 8081 on the host.
    #
    # Network position is not identity: every LAN/VPN device and every
    # container on homelab-net reaches this port without passing that access
    # list. Until control-api authentication exists (Phase 2) this block must
    # therefore stay static -- a placeholder page and a liveness probe -- and
    # must not proxy to doc-api, the VTT backend or any other internal API.
    # Its root is deliberately NOT the VTT root, so neither the VTT SPA nor the
    # bundled /codex-admin build is reachable from here.
    server {
        listen 8081 default_server;
        listen [::]:8081 default_server;
        server_name admin.internal.nexusvtt.com;

        server_tokens off;
        root /usr/share/nginx/admin-placeholder;

        # security-headers.conf is deliberately NOT included: its SAMEORIGIN
        # frame policy and no-referrer-when-downgrade referrer policy are looser
        # than this listener's. These headers are declared here only; any
        # add_header inside a location would silently drop all of them. `always`
        # keeps them on 4xx responses too.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        # Nothing here accepts input.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = / {
            try_files /index.html =404;
        }

        location = /placeholder.css {
        }

        # Liveness only: reveals no dependency, version or build detail.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
