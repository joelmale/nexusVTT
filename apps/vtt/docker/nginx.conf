user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-javascript text/x-cross-domain-policy application/x-font-ttf 
               application/x-font-opentype application/vnd.ms-fontobject 
               image/x-icon;

    # Caching
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    max;
        ~font/                     max;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        resolver 127.0.0.11 valid=10s;
        absolute_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        #
        # script-src carries a sha256 for the theme pre-warming script inlined in
        # index.html. It must run before first paint to avoid a flash of unstyled
        # content, so it cannot move into a bundle. If that script is EDITED the
        # hash stops matching and it is silently blocked again -- regenerate it
        # with:
        #   openssl dgst -sha256 -binary <script.js> | openssl base64
        # worker-src allows blob: because the 3D dice engine (Babylon/dice-box)
        # spawns its physics worker from a blob URL; without it the worker is
        # blocked by the script-src fallback.
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self' ws: wss: http: https: data: blob: 'unsafe-inline'; script-src 'self' 'sha256-kCY+4vzR5hFkTgOiL9nWFBV/YcxwM3P0hbskb/gD6oA='; worker-src 'self' blob:" always;

        # Cache control
        expires $expires;

        # Static assets (served from disk with fallback to asset-server)
        location /assets {
            root /usr/share/nginx/html;
            try_files $uri @asset_server;
            expires max;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self' ws: wss: http: https: data: blob: 'unsafe-inline'; script-src 'self' 'sha256-kCY+4vzR5hFkTgOiL9nWFBV/YcxwM3P0hbskb/gD6oA='; worker-src 'self' blob:" always;
            access_log off;
        }

        location @asset_server {
            set $asset_server "http://asset-server:5003";
            proxy_pass $asset_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # WebSocket proxy configuration (Nexus VTT)
        location /ws {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Cookie and session support for WebSocket
            proxy_set_header Cookie $http_cookie;

            # WebSocket timeout
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Socket.io proxy configuration
        location /socket.io {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Cookie and session support
            proxy_set_header Cookie $http_cookie;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Codex WebSocket proxy configuration
        location /codex-ws {
            set $codex_ws "http://doc-websocket:3002";
            proxy_pass $codex_ws/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # NexusCodex API dedicated endpoints (routing directly to doc-api:3000 without colliding with VTT /api)
        location /api/admin/ {
            set $doc_api "http://doc-api:3000";
            proxy_pass $doc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/deduplication/ {
            set $doc_api "http://doc-api:3000";
            proxy_pass $doc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/references/ {
            set $doc_api "http://doc-api:3000";
            proxy_pass $doc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/annotations/ {
            set $doc_api "http://doc-api:3000";
            proxy_pass $doc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/processing/ {
            set $doc_api "http://doc-api:3000";
            proxy_pass $doc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Codex API subpath proxy
        location /codex-api/ {
            set $doc_api "http://doc-api:3000";
            proxy_pass $doc_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # VTT API proxy
        location /api {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Cookie and session support
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
        }

        # Auth proxy (OAuth routes)
        location /auth {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Cookie and session support
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
        }

        # TMT library metadata and content-addressed image assets.
        location /library {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /library-assets {
            set $backend "http://backend:5001";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # The generator hub is a separate static app, NOT part of the SPA, and
        # GeneratorPanel loads it in an iframe from this same origin. Without
        # this block a missing or empty hub build falls through to the SPA
        # fallback below, the iframe boots a second copy of the VTT, and its
        # router sends that copy to /lobby -- which presents as "the Generator
        # pane shows the Lobby" rather than as a 404. This mirrors the
        # navigateFallbackDenylist already set in vite.config.ts, which nginx
        # has no way to know about.
        location /generator-hub/ {
            try_files $uri $uri/ =404;

            # The bundled generators are vendored Haxe/OpenFL builds whose
            # entry point is an inline <script> calling lime.embed(). The app's
            # script-src 'self' blocks it, so the 450KB payload downloads and
            # then never starts -- a blank panel with no network error. Hashes
            # were considered, but these files are regenerated wholesale by the
            # upstream tool, so a hash would break on every refresh.
            #
            # Relaxed HERE ONLY: the VTT app itself keeps the strict policy.
            # NOTE: add_header is not inherited once a block declares any of its
            # own, so every header the parent sets must be repeated here.
            add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
            include /etc/nginx/security-headers.conf;
        }

        # Character Forge — served directly from disk under /usr/share/nginx/html/forge/
        location = /forge {
            return 301 /forge/;
        }

        location /forge/ {
            try_files $uri $uri/ /forge/index.html;
        }

        # Codex runtime config stubs
        location = /config.js {
            return 200 "window.__NEXUSCODEX_CONFIG__ = {};\n";
            add_header Content-Type application/javascript;
        }

        location = /codex-dm/config.js {
            return 200 "window.__NEXUSCODEX_CONFIG__ = {};\n";
            add_header Content-Type application/javascript;
        }

        # Redirect legacy /codex paths to /codex-dm/
        location = /codex {
            return 301 /codex-dm/;
        }

        location /codex/ {
            return 301 /codex-dm/;
        }

        location = /codex-dm {
            return 301 /codex-dm/;
        }

        # Nexus Codex DM UI — served directly from disk under /usr/share/nginx/html/codex-dm/
        location /codex-dm/ {
            try_files $uri $uri/ /codex-dm/index.html;
        }

        location = /codex-admin {
            return 301 /codex-admin/;
        }

        # Nexus Codex Admin UI — served directly from disk under /usr/share/nginx/html/codex-admin/
        location /codex-admin/ {
            try_files $uri $uri/ /codex-admin/index.html;
        }

        # The service worker controls whether clients ever see a new build, so
        # it must never be served as immutable. The map above would otherwise
        # give it Cache-Control: max-age=1y; browsers cap worker freshness at
        # 24h, so a stale worker can keep serving old routing rules for a day
        # after a deploy.
        location = /sw.js {
            # `expires epoch` emits Cache-Control: no-cache on its own, which
            # is what a worker script wants: revalidate before use. Adding an
            # explicit add_header here would emit a second Cache-Control.
            expires epoch;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self' ws: wss: http: https: data: blob: 'unsafe-inline'; script-src 'self' 'sha256-kCY+4vzR5hFkTgOiL9nWFBV/YcxwM3P0hbskb/gD6oA='; worker-src 'self' blob:" always;
        }
    }
}
