server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The UI calls only control-api (apps/docs/platform/control-api-adr.md);
    # doc-api is never proxied to a browser. The production gateway is
    # apps/vtt/docker/nginx.conf (:8081); this file serves standalone builds.
    location /control-api/ {
        resolver 127.0.0.11 valid=10s;
        set $control_api "http://control-api:4000";
        proxy_pass $control_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # 320 MiB file plus multipart framing and metadata.
        client_max_body_size 321m;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}
